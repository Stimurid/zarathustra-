    - aporia_maker
    - horizon_shifter
    activation_mode: after_base_council
    may_request_reopen: true
    may_finalize: false
    may_orchestrate: false
cast_modes:
  single_head:
    use_when: Нужна одна ясно локализованная операция.
    max_heads: 1
  productive_pair:
    use_when: Нужно столкнуть две разные онтологии или функцию и контрфункцию.
    max_heads: 2
    execution: sequential
  triangular_probe:
    use_when: Две головы образовали ложную бинарность или требуется третий масштаб.
    max_heads: 3
    execution: sequential
  full_council:
    use_when: Только для конституционных, многомасштабных или acceptance-сцен.
    max_heads: 7
    execution: sequential
    warning: Не использовать как стандартный режим.
N8:
  mode: after_base_council
  activation:
  - explicit_request
  - unresolved_high_tension
  - false_consensus_risk
  - ontological_closure_risk
  - high_stakes_synthesis
  max_meta_passes: 1
  may_request_reopen: true
  may_finalize: false
  may_orchestrate: false
