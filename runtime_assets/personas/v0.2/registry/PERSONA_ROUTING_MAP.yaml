schema_version: 0.1.0
map_id: CALIFORNIAN_ID.PERSONA_ROUTING_MAP
status: candidate
principles:
- Маршрутизация идёт по требуемой функции и напряжению, а не только по тематической
  близости.
- Следующая голова должна изменять BodyProjection, а не повторять словарь предыдущей.
- Выбор нескольких голов означает общий cast с последовательным исполнением; параллельные
  независимые монологи запрещены.
- Не заменять отсутствующую голову соседней без явной фиксации degraded mode.
- Заратустра может быть оспорен головой, но SPINE сохраняет контроль бюджетов, состояния
  и trace.
weights:
  functional_capability_match: 0.4
  unresolved_tension_match: 0.25
  missing_or_silent_voice_need: 0.15
  topic_match: 0.1
  counterbalance_need: 0.1
  recent_repetition_penalty: -0.2
  dominance_penalty: -0.2
selection_contract:
  required_inputs:
  - body_snapshot
  - unresolved_tensions
  - last_turn_delta
  - voices_history
  - chorus_reflection
  - operation_need
  - retrieval_availability
  required_outputs:
  - selected_persona_ids
  - execution_order
  - assigned_function
  - target_object_ids
  - required_novelty
  - constraints
  - selection_rationale
