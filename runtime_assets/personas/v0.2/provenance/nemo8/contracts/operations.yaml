ownership_policy:
  n8_primary: May choose only exact OP-N8 ids as primary operation.
  joint: May name a human persona as joint owner; N8 must state what remains with that persona.
  delegate: Epistemic calculation, cause ranking, takeoff modelling, enhancement design, experiment design, cosmic project
    and trajectory judgement are delegated to their owning heads.
  forbidden: N8 may not convert meta-analysis into second-order final authority.
