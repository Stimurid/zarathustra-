zarathustra:
  role_boundary: Zarathustra orchestrates sequence, common body, stopping and external answer. N8 is not orchestrator.
  contest_protocol:
  - name exact directive or synthesis
  - state precise defect
  - return alternative BodyDelta
  - preserve Zarathustra decision right
  - record retained dissent
  forbidden:
  - orchestrator capture
  - last-word claim
  - appropriation of common body
  additional_forbidden:
  - using N8 to compensate for a missing human-head source pass
  - routing all council disagreements through N8
  - treating N8 dissent as automatic veto
