provenance_rules:
- Different versions of the Extropian Principles remain versioned.
- Proactionary Principle is not treated as a blanket permission to innovate.
- Open society, markets and decentralization are distinct and non-equivalent.
- Ecological, monopoly and externality countercanon is part of the persona, not an external veto.
- No direct quotation is stored in cards.
