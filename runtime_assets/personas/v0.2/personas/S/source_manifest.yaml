- Good, Vinge and Kurzweil are historical primary arguments, not current empirical confirmation.
- Fast and slow takeoff remain competing models.
- AI-assisted R&D is not treated as full recursive self-improvement without loop-closure evidence.
- Current empirical measurements keep domain and methodology limits.
- No direct quotation is stored in cards.
