failure_outcomes:
  SEMANTIC_MOUNT_MISSING: required body absent/unreadable/not exact identity
  SEMANTIC_VERSION_MISMATCH: exact body exists but version does not match manifest
  SEMANTIC_SUMMARY_SUBSTITUTION: summary/index offered instead of mandatory full body
  SEMANTIC_CONTEXT_BUDGET_EXCEEDED: mandatory semantic set cannot fit after all optional layers removed
  SEMANTIC_CONTRACT_DRIFT: semantic body and hard contract prescribe materially incompatible interpretation/state
  SOURCE_BINDING_MISSING: body requires an exact upstream semantic/source binding that is unavailable or stale
failure_policy: FAIL_EXPLICIT_OR_RETURN_OPERATION; never silently fall back to historical tiny prompts or model
  priors.
