principles:
- CORE is mounted for every Socrates execution before any prompt/router semantic interpretation.
- Required phase bodies are selected deterministically by router/phase, never by semantic retrieval similarity.
- Conditional bodies require typed triggers and are logged in MountTrace.
- Missing required body, wrong exact identity, wrong semantic version, or prohibited summary substitution fails
  explicitly.
- Context pressure may remove optional examples/personas/retrieval before semantic bodies; it may not silently compress
  or omit required semantics.
- Historical G-S25 P00-P09 are control evidence and cannot serve as semantic fallback.
