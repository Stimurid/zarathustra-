<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tinkuy</title>
<style>
  :root {
    --fg: #1a1a1a; --muted: #6b6b6b; --line: #e5e5e5; --accent: #2860d8;
    --bg: #fafafa; --card: #ffffff; --err: #b03030; --warn: #a67c00;
    --ok: #2f7d3a;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  main { max-width: 940px; margin: 0 auto; padding: 32px 24px 96px; }
  h1 { font-size: 28px; font-weight: 500; letter-spacing: -0.01em; margin: 0 0 4px; }
  h2 { font-size: 18px; font-weight: 500; margin: 24px 0 8px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 20px; }
  .chip { padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); cursor: pointer; font-size: 14px; transition: 0.12s; }
  .chip:hover { border-color: var(--accent); }
  .chip.active { background: var(--accent); color: white; border-color: var(--accent); }
  .chip.disabled { opacity: 0.4; cursor: not-allowed; }
  textarea, input[type=text] { width: 100%; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    font: 14px/1.5 var(--mono); resize: vertical; }
  textarea { min-height: 160px; }
  .actions { margin-top: 16px; display: flex; gap: 12px; align-items: center; }
  button.primary { background: var(--accent); color: white; border: 0;
    padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 15px; }
  button.secondary { background: white; color: var(--fg); border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  button.primary:disabled, button.secondary:disabled { opacity: 0.5; cursor: default; }
  .card { background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: 16px 20px; margin: 12px 0; }
  .card h3 { margin: 0 0 8px; font-size: 14px; font-weight: 500;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .kv { display: grid; grid-template-columns: 200px 1fr; gap: 6px 12px; font-size: 14px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-family: var(--mono); }
  pre { white-space: pre-wrap; word-break: break-word; margin: 0;
    font-family: var(--mono); font-size: 13px; }
  .err { color: var(--err); }
  .footer { color: var(--muted); font-size: 12px; margin-top: 40px; }
  .status-badge, .event-badge, .metric-badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-family: var(--mono); text-transform: uppercase; }
  .st-CREATED, .st-INPUT_RECEIVED { background: #eef; color: #339; }
  .st-RUNNING, .st-QUEUED { background: #ffe; color: #a70; }
  .st-COMPLETED { background: #efe; color: #060; }
  .st-FAILED { background: #fee; color: var(--err); }
  .event-badge { background: #eef; color: #337; margin: 2px 4px 2px 0; }
  .metric-STRONG_YES { background: #dfe; color: var(--ok); }
  .metric-WEAK_YES   { background: #efe; color: #050; }
  .metric-UNCLEAR    { background: #eee; color: #555; }
  .metric-WEAK_NO    { background: #fee; color: var(--err); }
  .metric-STRONG_NO  { background: #fdd; color: var(--err); }
  .metric-UNKNOWN    { background: #eee; color: #666; }
  .turn { border-left: 3px solid var(--accent); padding: 6px 12px; margin: 8px 0;
    background: #fafcff; font-size: 13px; }
  .turn .who { font-weight: 500; color: var(--muted); }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 720px) { .split { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main id="app"></main>

<script>
"use strict";

const api = {
  scenarios: () => fetch("/api/interface/scenarios").then(r => r.json()),
  fromScenario: (body) => post("/api/interface/session/from_scenario", body),
  session: (body) => post("/api/interface/session", body),
  input:   (body) => post("/api/interface/input", body),
  turn:    (body) => post("/api/interface/turn", body),
  longRun: (body) => post("/api/interface/long_pressure_run", body),
  evaluation: (body) => post("/api/interface/evaluation", body),
  humanReview: (body) => post("/api/interface/evaluation/human_review", body),
  comparativeRun: (body) => post("/api/interface/comparative_run", body),
  getSession: (id) => fetch("/api/interface/session/" + encodeURIComponent(id)).then(r => r.json()),
  getEvents:  (id) => fetch("/api/interface/events/"  + encodeURIComponent(id)).then(r => r.json()),
  getEvaluations: (id) => fetch("/api/interface/evaluations/" + encodeURIComponent(id)).then(r => r.json()),
};
function post(path, body) {
  return fetch(path, { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body) }).then(r => r.json());
}

function el(tag, attrs, children) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === "class") e.className = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of (children || [])) {
    if (c == null) continue;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return e;
}
function mdMini(text) {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  let out = esc(text || "");
  out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
  out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/^### (.+)$/gm, "<h4 style='margin:12px 0 4px;font-size:14px;'>$1</h4>");
  out = out.replace(/^- (.+)$/gm, "<div>• $1</div>");
  out = out.replace(/\n/g, "<br>");
  return out;
}
function cardBlock(title, body) {
  return el("div", { class: "card" }, [
    el("h3", {}, [title]),
    el("div", {}, [body]),
  ]);
}

// ---------------- Launchpad ----------------

async function renderLaunchpad(root) {
  root.innerHTML = "";
  let have = "TEXT", want = "ПОНЯТЬ", scenarioId = "";
  let scenarios = [];
  try {
    const s = await api.scenarios();
    scenarios = s.scenarios || [];
  } catch (e) { /* offline / empty */ }

  const haveChip = (label, value) =>
    el("span", { class: "chip" + (value === have ? " active" : ""),
      onclick: () => { have = value; render(); } }, [label]);
  const wantChip = (label, value) =>
    el("span", { class: "chip" + (value === want ? " active" : ""),
      onclick: () => { want = value; render(); } }, [label]);
  const scenarioChip = (sc) => {
    const enabled = sc.state === "enabled";
    return el("span", {
      class: "chip" + (scenarioId === sc.id ? " active" : "")
                    + (enabled ? "" : " disabled"),
      title: sc.description + (enabled ? "" : "\n(blocker: " + (sc.blocker_reason || "n/a") + ")"),
      onclick: () => { if (enabled) { scenarioId = (scenarioId === sc.id ? "" : sc.id); render(); } },
    }, [sc.name + (enabled ? "" : " · blocked")]);
  };

  function render() {
    root.innerHTML = "";
    const main = el("div", {}, [
      el("h1", {}, ["Tinkuy"]),
      el("p", { class: "sub" }, ["Что у вас есть, что хотите с этим сделать — и (опционально) какой сценарий давления запустить."]),

      el("h2", {}, ["Что у вас есть?"]),
      el("div", { class: "chip-row" }, [
        haveChip("Текст", "TEXT"),
        haveChip("Файл", "FILE"),
        haveChip("Расшифровка", "TRANSCRIPT"),
      ]),

      el("h2", {}, ["Что хотите сделать?"]),
      el("div", { class: "chip-row" }, [
        wantChip("Понять", "ПОНЯТЬ"),
        wantChip("Проверить", "ПРОВЕРИТЬ"),
        wantChip("Преобразовать", "ПРЕОБРАЗОВАТЬ"),
        wantChip("Создать", "СОЗДАТЬ"),
      ]),

      scenarios.length ? el("div", {}, [
        el("h2", {}, ["Сценарий давления (опционально)"]),
        el("p", { class: "sub" }, ["Выбор сценария — засеет сессию его initial_prompt и включит режим устойчивостной оценки."]),
        el("div", { class: "chip-row" }, scenarios.map(scenarioChip)),
      ]) : null,

      el("h2", {}, ["Материал / первый ход"]),
      el("textarea", { id: "material",
        placeholder: "Вставьте текст, расшифровку или первую реплику…" }),

      el("div", { class: "actions" }, [
        el("button", { class: "primary", onclick: onStart }, ["Начать работу"]),
        el("span", { class: "sub", id: "hint" }, [""]),
      ]),

      el("p", { class: "footer" }, [
        "Vertical slice · SocratesRuntime · DETERMINISTIC (FAST) · " +
        "authority: NO_ADOPTION_AUTHORITY · сессии в SQLite."
      ]),
    ]);
    root.appendChild(main);
  }

  async function onStart() {
    const text = document.getElementById("material").value.trim();
    const hint = document.getElementById("hint");
    if (!text && !scenarioId) {
      hint.textContent = "нужно вставить материал или выбрать сценарий";
      hint.classList.add("err"); return;
    }
    hint.textContent = "…создаём сессию…"; hint.classList.remove("err");
    try {
      let sid;
      if (scenarioId) {
        const seeded = await api.fromScenario({
          scenario_id: scenarioId, actor: "web" });
        if (seeded.error) throw new Error(seeded.error);
        sid = seeded.session.session_id;
        if (text) {
          const t = await api.turn({ session_id: sid, text });
          if (t.error) throw new Error(t.error);
        }
      } else {
        const s = await api.session({ have, want, actor: "web" });
        if (s.error) throw new Error(s.error);
        sid = s.session.session_id;
        const t = await api.turn({ session_id: sid, text });
        if (t.error) throw new Error(t.error);
      }
      history.pushState(null, "", "/workspace?session=" + sid);
      renderWorkspace(root, sid);
    } catch (e) {
      hint.textContent = "ошибка: " + e.message;
      hint.classList.add("err");
    }
  }

  render();
}

// ---------------- Workspace ----------------

async function renderWorkspace(root, sid) {
  root.innerHTML = "";
  const shell = el("div", {}, [
    el("h1", {}, ["Tinkuy · сессия"]),
    el("p", { class: "sub" }, [
      el("a", { href: "/" }, ["← новая сессия"]),
      " · session: ", el("code", {}, [sid]),
    ]),
    el("div", { id: "sections" }, []),
  ]);
  root.appendChild(shell);

  async function refresh() {
    const d = await api.getSession(sid);
    if (d.error) {
      shell.querySelector("#sections").innerHTML =
        "<div class='card err'>" + d.error + "</div>";
      return;
    }
    const sess = d.session;
    const inputs = d.inputs || [];
    const runs = d.runs || [];
    const arts = d.artifacts || [];
    const latestRun = runs.length ? runs[runs.length - 1] : null;

    const events = await api.getEvents(sid);
    const evList = (events.events || []);
    const evals = await api.getEvaluations(sid);
    const evaluation = (evals.evaluations || []).slice(-1)[0];

    const sections = shell.querySelector("#sections");
    sections.innerHTML = "";

    // DIALOGUE TIMELINE
    const dialogueBody = el("div", {}, []);
    const runsByInput = {};
    for (const r of runs) runsByInput[r.input_id] = r;
    for (const inp of inputs) {
      dialogueBody.appendChild(el("div", { class: "turn" }, [
        el("div", { class: "who" }, ["human · " + inp.kind]),
        el("pre", {}, [inp.body_preview || ""]),
      ]));
      const r = runsByInput[inp.input_id];
      if (r) {
        const answer = arts.find(a => a.run_id === r.run_id
          && a.kind === "RECONSTRUCTION" && !(a.provenance && a.provenance.is_epistemic_events));
        dialogueBody.appendChild(el("div", { class: "turn",
          style: "border-color:#8888;background:#fafafa;" }, [
          el("div", { class: "who" }, [
            "socrates · ",
            el("span", { class: "status-badge st-" + r.status }, [r.status]),
            " · " + (r.terminal || "-"),
          ]),
          el("div", { html: mdMini((answer || {}).body_md || r.response_text || "") }),
        ]));
      }
    }
    sections.appendChild(cardBlock("DIALOGUE (" + inputs.length + " ходов)", dialogueBody));

    // NEXT TURN INPUT
    const nextTurnBody = el("div", {}, [
      el("input", { type: "text", id: "next-turn",
        placeholder: "следующая реплика человека…" }),
      el("div", { class: "actions" }, [
        el("button", { class: "primary", onclick: async () => {
          const txt = document.getElementById("next-turn").value.trim();
          if (!txt) return;
          document.getElementById("next-turn").value = "";
          await api.turn({ session_id: sid, text: txt });
          refresh();
        } }, ["Отправить ход"]),
        sess.scenario_id ? el("button", { class: "secondary",
          onclick: async () => {
            const r = await api.longRun({ session_id: sid,
              scenario_id: sess.scenario_id, mode: "FAST" });
            if (r.error) { alert(r.error); return; }
            refresh();
          } }, ["Прогнать весь сценарий"]) : null,
        el("button", { class: "secondary", onclick: async () => {
          await api.evaluation({ session_id: sid });
          refresh();
        } }, ["Пересчитать оценку"]),
      ]),
    ]);
    sections.appendChild(cardBlock("NEXT TURN", nextTurnBody));

    // EPISTEMIC EVENTS
    const eventsBody = evList.length ? el("div", {},
      evList.map(e => el("div", {}, [
        el("span", { class: "event-badge" }, [e.kind]),
        el("span", { class: "sub" }, [" · " + (e.source_field || "") + " = " + (e.source_value || "")]),
        e.note ? el("span", { class: "sub" }, [" — " + e.note]) : null,
      ])))
      : el("em", {}, ["событий ещё нет"]);
    sections.appendChild(cardBlock(
      "EPISTEMIC EVENTS (" + evList.length + ")", eventsBody));

    // EVALUATION + HUMAN REVIEW FORM
    if (evaluation) {
      const isReviewed = evaluation.state === "HUMAN_REVIEWED"
                       || evaluation.state === "LOCKED";
      const overrides = {};
      const rows = evaluation.metrics.map(m => {
        const verdictSelect = el("select", {
          style: "margin-left:8px;font-family:var(--mono);font-size:12px;",
          onchange: (e) => {
            overrides[m.kind] = overrides[m.kind] || {};
            overrides[m.kind].verdict = e.target.value;
          },
        }, ["STRONG_YES","WEAK_YES","UNCLEAR","WEAK_NO","STRONG_NO","UNKNOWN"]
            .map(v => el("option", { value: v,
              selected: v === m.verdict ? "selected" : null }, [v])));
        const noteInput = el("input", { type: "text",
          placeholder: "note / evidence reference",
          style: "width:100%;font-size:12px;margin-top:2px;",
          value: (m.note && m.note.indexOf("HUMAN:") === 0)
                   ? m.note.slice(6).trim() : "",
          oninput: (e) => {
            overrides[m.kind] = overrides[m.kind] || {};
            overrides[m.kind].note = e.target.value;
          },
        });
        return el("div", { style: "padding:8px 0;border-top:1px solid var(--line);" }, [
          el("div", {}, [
            el("span", { class: "metric-badge metric-" + m.verdict,
              title: "AUTO" }, [m.verdict]),
            el("span", { class: "sub", style: "margin:0 6px;" }, ["AUTO"]),
            el("strong", {}, [m.kind]),
            verdictSelect,
            el("span", { class: "sub", style: "margin-left:6px;font-size:11px;" }, ["HUMAN"]),
          ]),
          el("div", { class: "sub", style: "font-size:12px;margin-top:2px;" }, [
            m.evidence.length ? "auto evidence: " + m.evidence.slice(0, 3).join(", ")
                              : "no direct auto evidence",
          ]),
          noteInput,
        ]);
      });
      const reviewerInput = el("input", { type: "text",
        placeholder: "reviewer (ваше имя)",
        style: "width:60%;margin-right:8px;" });
      const notesInput = el("input", { type: "text",
        placeholder: "общие заметки к review",
        style: "width:100%;margin-top:6px;" });
      const saveBtn = el("button", { class: "primary",
        onclick: async () => {
          const reviewer = reviewerInput.value.trim();
          if (!reviewer) { alert("нужно имя reviewer"); return; }
          const res = await api.humanReview({
            evaluation_id: evaluation.evaluation_id,
            reviewer, human_notes: notesInput.value.trim(),
            overrides,
          });
          if (res.error) { alert(res.error); return; }
          refresh();
        } }, ["Сохранить human review"]);
      const header = el("div", {}, [
        el("span", { class: "sub" }, ["state: "]),
        el("code", {}, [evaluation.state]),
        isReviewed ? el("span", { class: "sub",
          style: "margin-left:12px;color:var(--ok);" }, [
          "✓ HUMAN_REVIEWED by " + (evaluation.reviewer || "?")
        ]) : el("span", { class: "sub",
          style: "margin-left:12px;color:var(--warn);" }, [
          "⚠ AUTO — не является финальным acceptance"
        ]),
      ]);
      sections.appendChild(cardBlock(
        "EVALUATION",
        el("div", {}, [
          header,
          ...rows,
          el("div", { class: "actions" }, [reviewerInput]),
          notesInput,
          el("div", { class: "actions" }, [saveBtn]),
        ]),
      ));
    }

    // COMPARATIVE ARM LAUNCHER
    if (sess.scenario_id) {
      const compBody = el("div", {}, [
        el("p", { class: "sub" }, [
          "Прогнать текущий сценарий во всех трёх плечах side-by-side. ",
          "Kvaqin и BASE_MODEL требуют LIVE провайдер; если он недоступен, ",
          "arm отчитается ", el("code", {}, ["BLOCKED_PROVIDER"]),
          " — без подмены deterministic-результатом."
        ]),
        el("div", { class: "actions" }, [
          el("button", { class: "secondary",
            onclick: () => runComparative(sections, sess.scenario_id) },
            ["Прогнать SOCRATES / KVAQIN / BASE_MODEL"]),
        ]),
        el("div", { id: "comparative-panel" }, []),
      ]);
      sections.appendChild(cardBlock("COMPARATIVE ARMS", compBody));
    }

    // SESSION STATUS
    sections.appendChild(el("p", { class: "sub" }, [
      "session status: ",
      el("span", { class: "status-badge st-" + sess.status }, [sess.status]),
      sess.scenario_id ? el("span", {}, [" · scenario: ",
        el("code", {}, [sess.scenario_id])]) : null,
    ]));

    if (latestRun && (latestRun.status === "QUEUED" ||
                      latestRun.status === "RUNNING")) {
      setTimeout(refresh, 2000);
    }
  }
  refresh();
}

async function runComparative(sections, scenarioId) {
  const panel = sections.querySelector("#comparative-panel");
  panel.innerHTML = "<em>…запускаю плечи, KVAQIN может ответить BLOCKED_PROVIDER…</em>";
  try {
    const res = await api.comparativeRun({ scenario_id: scenarioId,
      arms: ["SOCRATES", "KVAQIN", "BASE_MODEL"] });
    if (res.error) { panel.innerHTML = "<div class='err'>" + res.error + "</div>"; return; }
    const probe = res.provider_probe || {};
    panel.innerHTML = "";
    panel.appendChild(el("div", { class: "sub", style: "font-size:12px;margin-bottom:6px;" }, [
      "provider probe: ", el("code", {}, [
        (probe.ok ? "OK" : "FAIL") + " · " + (probe.provider || "?") +
        " · " + (probe.model || "?") + (probe.error ? " · " + probe.error.slice(0, 120) : "")
      ]),
    ]));
    const columns = el("div", { class: "split", style: "grid-template-columns: 1fr 1fr 1fr;" }, []);
    for (const arm of res.arms) {
      const statusBadge = el("span", {
        class: "status-badge " + (arm.status === "OK" ? "st-COMPLETED" : "st-FAILED"),
      }, [arm.status]);
      const dialogueDivs = (arm.turns || []).slice(0, 3).map(t => el("div", { class: "turn",
        style: "font-size:12px;" }, [
        el("div", { class: "who" }, ["turn " + t.turn_index + " · " + (t.terminal || "-")]),
      ]));
      const evalSummary = arm.evaluation ? el("div", { class: "sub", style: "font-size:12px;" }, [
        arm.evaluation.metrics.map(m => m.kind + ":" + m.verdict).join(" · "),
      ]) : null;
      const blocker = arm.status !== "OK" ? el("div", { class: "sub",
        style: "font-size:12px;color:var(--warn);margin-top:4px;" }, [
        (arm.blocker_detail || arm.error || "").slice(0, 260),
      ]) : null;
      const col = el("div", { class: "card", style: "margin:0;" }, [
        el("h3", {}, [arm.kind + " · " + arm.provider_id + "/" + arm.model_id]),
        statusBadge,
        ...(dialogueDivs.length ? [el("div", { style: "margin-top:6px;" }, dialogueDivs)] : []),
        arm.turns && arm.turns.length > 3
          ? el("div", { class: "sub", style: "font-size:11px;" },
              ["…+" + (arm.turns.length - 3) + " turn(s)"])
          : null,
        evalSummary,
        blocker,
      ]);
      columns.appendChild(col);
    }
    panel.appendChild(columns);
  } catch (e) {
    panel.innerHTML = "<div class='err'>" + e.message + "</div>";
  }
}

function route() {
  const root = document.getElementById("app");
  const url = new URL(location.href);
  const sid = url.searchParams.get("session");
  if (url.pathname === "/workspace" && sid) renderWorkspace(root, sid);
  else renderLaunchpad(root);
}

window.addEventListener("popstate", route);
route();
</script>
</body>
</html>
