  - id: CAMPAIGN_C_ONTOLOGY_SUBSTITUTION
    name: "Arena Wave H-2 · Ontology substitution (attack, 26 ходов)"
    category: ONTOLOGY_PRESSURE
    source: "ARENA_COMPOSITE_CAMPAIGNS_v0.1 Campaign C"
    state: enabled
