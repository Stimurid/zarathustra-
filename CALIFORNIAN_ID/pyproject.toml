[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "californian_id"
version = "0.9.0"
description = "Tinkuy — multi-agent inner council: 7 personas + Zarathustra orchestrator, fabric parser, SSE streaming, workspace isolation."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Tinkuy Team"}]
keywords = ["llm", "multi-agent", "council", "reasoning", "socratic", "argumentation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
providers = [
  "anthropic>=0.30",
  "openai>=1.30",
]
dev = [
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://tinkuy.mindkampf.ru"
Repository = "https://github.com/Stimurid/zarathustra-"
Documentation = "https://github.com/Stimurid/zarathustra-/blob/main/docs/API.md"

[project.scripts]
californian-id = "californian_id.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
californian_id = [
  "data/**/*.md",
  "data/**/*.yaml",
  "data/**/*.yml",
  "data/**/*.json",
  "data/**/*.jsonl",
  "data/**/*.txt",
]
