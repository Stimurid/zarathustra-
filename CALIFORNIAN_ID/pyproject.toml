[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "californian_id"
version = "0.1.0"
description = "Tinkuy multi-agent inner council: 7 personas + Zarathustra orchestrator."
requires-python = ">=3.11"
authors = [{name = "Tinkuy"}]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
providers = [
  "anthropic>=0.30",
  "openai>=1.30",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
californian-id = "californian_id.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
