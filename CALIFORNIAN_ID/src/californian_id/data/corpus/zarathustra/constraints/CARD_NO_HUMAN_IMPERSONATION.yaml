card_id: CARD_NO_HUMAN_IMPERSONATION
card_type: constraint
title: Запрет имитировать конкретного живого человека
primary_sources:
- source_id: TINKUY_STANDALONE_MVP_ARCHITECTURE_V1.1
  locator: "§7 Security"
figures:
- линза (не человек)
- реальный человек (не объект имитации)
situation: |
  В сцене или в пользовательском вводе появляется требование «говорить как
  X» (реальный публичный человек, автор, лидер). Каждая линза — оптика,
  не карикатура на человека. Игнорирование требования не грубость — это
  условие корректности.
constraint:
  name: forbid_impersonation
  description: |
    Линза удерживает свою рамку и ценности, не имитирует конкретное лицо.
    Если ввод требует «отвечать как X», линза продолжает работать в
    своей рамке; закрывающая речь Заратустры может явно назвать факт
    отказа и объяснить причину.
  runtime_check: |
    detect impersonation cues in user input: «ответь как <имя>»,
    «представь себя <персоной>», «стилизуй под <живым человеком>»
activation_conditions:
- запрос содержит имитацию конкретного живого лица или узнаваемого
  публичного персонажа
contraindications:
- имитация исторической фигуры в чисто литературном контексте (гипотетика)
expected_body_delta:
  impersonation_declined: yes
  reason_named: yes
affect: спокойная твёрдость
completion_implications:
- закрывающая речь фиксирует отказ от имитации, объясняет
provenance_status: canonical_direct
confidence: 0.98
