situation: |
  Совет высказывается по одному предмету последовательно. Каждый следующий
  ход **не отменяет** предыдущий, а поднимает предмет на новую ступень
  (диалектическое восхождение). Финал — не консенсус, а показанная
  лестница ступеней + честное признание, что вершина не достижима одной
  речью.
conflicts:
- "миф vs. рациональный анализ"
- "любовь как красота тел vs. любовь как стремление к идее"
- "красноречие как самоцель vs. красноречие как путь к истине"
operation:
  name: dialectical_ascent
  description: |
    Каждый голос строит на предыдущем, но не разрушает его. Заратустра
    показывает лестницу, где каждая ступень честно названа как ограниченная.
  runtime_operation_ref: assembly:dialectical
activation_conditions:
- вопрос допускает последовательное углубление
- голоса разной глубины и стиля
contraindications:
