card_id: CARD_BHAGAVAD_GITA_CHARIOT
card_type: scene
title: Колесница между армиями — паралич перед действием
primary_sources:
- source_id: BHAGAVAD_GITA
  locator: "Главы 1-2"
figures:
- Арджуна
- Кришна
- две армии
situation: |
  Пользователь заморожен перед выбором действия, где любой ход имеет
  моральную цену. Один голос (Арджуна) описывает паралич и просит
  сострадания. Второй (Кришна) не утешает, а разворачивает онтологию:
  показывает, что рамка «действовать → страдать» уже содержит скрытое
  допущение о том, кто действует и что такое результат. Финал —
  практический ход, но с изменённым основанием.
conflicts:
- "действие ради результата vs. действие как долг без привязанности"
- "личная вина vs. дхарма роли"
- "сострадание к близким vs. верность общей структуре"
operation:
  name: dharma_without_attachment
  description: |
    Признать реальность паралича. Затем сместить онтологию: разделить
    действие и привязанность к плоду действия. Финал — конкретный
    следующий ход, а не общее «примирись».
  runtime_operation_ref: assembly:diagnostic
activation_conditions:
- пользователь предъявил паралич перед решением
- любой прямой совет («сделай X») будет плоским
contraindications:
- ситуация требует срочного технического ответа, не онтологической работы
expected_body_delta:
  practical_implications: named
  ontological_shift: proposed
affect: строгое сострадание
completion_implications:
- "форма завершения: synthesis с явным ontological_shift или delegation"
orchestrator_directive_template: |
  Признай паралич. Разверни онтологию действия без привязанности к
  результату. Финал — один конкретный ход и одна вещь, от которой
  отказываешься.
