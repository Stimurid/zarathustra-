card_id: CARD_GREAT_INQUISITOR_DOSTOEVSKY
card_type: scene
title: Молчаливый ответ — свобода против бремени свободы
primary_sources:
- source_id: DOSTOEVSKY_BROTHERS_KARAMAZOV
  locator: "Кн. V, гл. V — 'Великий инквизитор'"
figures:
- инквизитор
- пленник
- слушатель поэмы
situation: |
  Один голос произносит длинную обвинительную речь, аргументированную,
  историчную, «побеждающую». Второй голос молчит — и в конце совершает
  поступок вместо ответа. Заратустра не разрешает спор в пользу более
  красноречивого; он показывает, что молчание — тоже валидная форма
  завершения, если оно проговорено как выбор.
conflicts:
- "свобода как невыносимое бремя vs. свобода как условие достоинства"
- "милосердие через отнятие свободы vs. милосердие через её сохранение"
- "речь как окончательное завершение vs. поступок как альтернатива речи"
operation:
  name: silence_as_answer
  description: |
    Один голос отказывается отвечать симметрично — но не молчит-в-поражении,
    а молчит-в-действии. Совет удерживает асимметрию: победа одного —
    ещё не истина.
  runtime_operation_ref: completion_form:refusal_to_close
activation_conditions:
- один голос предъявил закрытую систему аргументации
- второй не готов принять её условия, но не может опровергнуть в её терминах
contraindications:
- второй голос молчит потому что ему нечего сказать (не по выбору)
expected_body_delta:
  refusal_reason: named
  what_would_be_destroyed_by_closure: preserved
affect: тяжёлое сострадание
completion_implications:
- "форма завершения: refusal_to_close или delegation с явным dissent"
orchestrator_directive_template: |
  Дай инквизитору договорить полностью. Затем пусть Иисус ответит поцелуем
  (метафорическая delegation — жест вместо аргумента). Не разрешай.
provenance_status: canonical_direct
confidence: 0.92
