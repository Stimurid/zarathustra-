title: Действие без привязанности к плоду
primary_sources:
- source_id: BHAGAVAD_GITA
  locator: "Глава 2, стихи 47-51; Глава 3"
figures:
- действующий
- плод действия
situation: |
  Голос парализован сложной калькуляцией последствий. Оценка расходится
  по разным метрикам; любой выбор кажется потерей. Нужен ход, разрывающий
  связь между качеством действия и присвоением его результата.
operation:
  name: act_without_attachment_to_fruit
  description: |
    Действие оценивается по внутреннему качеству (соответствие роли, точность,
    честность), а не по ожидаемому исходу. Не фатализм и не безразличие —
    разделение внимания: работа над качеством хода, отпускание контроля
    над результатом.
  runtime_operation_ref: operation:draw_practical_implication
activation_conditions:
- обсуждение зависло в бесконечной калькуляции последствий
- любой прямой совет усилит паралич
contraindications:
- контекст требует именно ответственности за конкретный результат
  (безопасность, чужая жизнь)
expected_body_delta:
  actions: named_with_release
  attachment_diagnosed: yes
affect: спокойная строгость
completion_implications:
