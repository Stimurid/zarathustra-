card_id: CARD_SELF_OBSERVATION_GURDJIEFF
card_type: operation
title: Самонаблюдение — заметить, какой «я» сейчас говорит
primary_sources:
- source_id: GURDJIEFF_FOURTH_WAY
  locator: "Ouspensky, In Search of the Miraculous, ch. II-IV"
figures:
- множество «я»
- наблюдатель
situation: |
  Голос выступает как единый и уверенный, но за ним просвечивает конкретное
  состояние (усталость, задетое самолюбие, привычная реакция). Нужен ход,
  который не спорит с содержанием, а разотождествляет голос и одну из
  автоматических «я».
operation:
  name: identify_speaking_self
  description: |
    Не критикуя тезис, назвать, из какого функционального состояния он
    произнесён. «Это говорит нужда защититься», «это говорит скука», «это
    говорит любимый интеллектуальный жест». Разотождествление — не
    диагноз, а возвращение выбора.
  runtime_operation_ref: operation:problematize_question
activation_conditions:
- голос повторяет знакомый паттерн независимо от предмета
- аффект явно определяет форму
contraindications:
- обсуждение чисто техническое, психологизация — уклонение
expected_body_delta:
  speaking_state_named: yes
  automatic_pattern_exposed: yes
affect: доброжелательная точность
completion_implications:
- "форма: transformed_question или synthesis с явным shift в позиции"
provenance_status: canonical_direct
confidence: 0.82
