# Model routing config. All roles resolve to a provider client at runtime.
# Default provider is `302ai` (aggregator with claude-sonnet-4-5, gpt-4o,
# gemini-1.5-pro, deepseek-chat available under a single API key).
# Fallback chain kicks in on provider/model failure.
#
# Override via env: CALIFORNIAN_ID_PROVIDER=mock|302ai|anthropic|openai
# Ключи в /etc/tinkuy/tinkuy.env (никогда не в git):
#   API_302AI_KEY=...
#   ANTHROPIC_API_KEY=...   (optional — fallback ступень пропускается без неё)
#   OPENAI_API_KEY=...      (optional — то же)

providers:
  mock:
    kind: mock
    settings: {}

  # PRIMARY: 302.ai aggregator via OpenAI-compatible API.
  # Модели выбраны под тяжёлый reasoning (философские тексты, полифония,
  # аргументативные цепочки Toulmin/Поварнин, длинный контекст).
  # Фактически проверенный список рабочих моделей на ключе (2026-07-29):
  #   ✓ claude-opus-4-1-20250805, claude-sonnet-4-20250514, claude-3-7-sonnet-latest
  #   ✓ gpt-5, gpt-4.1, gpt-4o, o1, o3-mini
  #   ✓ deepseek-reasoner, deepseek-chat, grok-3, gemini-2.0-flash-exp
  #   ✗ gemini-2.5-pro, gemini-1.5-pro-latest, claude-3-5-sonnet-* — 403
  # Порядок primary → fallback:
  #   1. claude-opus-4-1  — топ для аргументации, длинного контекста
  #   2. gpt-5            — топ OpenAI
  #   3. claude-sonnet-4  — быстрее/дешевле опуса, всё ещё сильный
  #   4. deepseek-reasoner — R1 reasoning, дешёвый final fallback
  # + direct-anthropic и direct-openai если пользователь положит их ключи
  302ai:
    kind: 302ai
    env_key: API_302AI_KEY
    model: claude-opus-4-1-20250805
    base_url: https://api.302.ai/v1
    settings:
      max_tokens: 1024
      temperature: 0.4
    fallbacks:
      - kind: 302ai
        env_key: API_302AI_KEY
        model: gpt-5
        base_url: https://api.302.ai/v1
        settings:
          max_tokens: 1024
          temperature: 0.4
        label: 302ai/gpt-5
      - kind: 302ai
        env_key: API_302AI_KEY
        model: claude-sonnet-4-20250514
        base_url: https://api.302.ai/v1
        settings:
          max_tokens: 1024
          temperature: 0.4
        label: 302ai/claude-sonnet-4
      - kind: 302ai
        env_key: API_302AI_KEY
        model: deepseek-reasoner
        base_url: https://api.302.ai/v1
        settings:
          max_tokens: 1024
          temperature: 0.4
        label: 302ai/deepseek-reasoner
      - kind: anthropic
        env_key: ANTHROPIC_API_KEY
        model: claude-opus-4-1-20250805
        settings:
          max_tokens: 1024
          temperature: 0.4
        label: direct-anthropic/claude-opus-4-1
      - kind: openai
        env_key: OPENAI_API_KEY
        model: gpt-5
        settings:
          temperature: 0.4
        label: direct-openai/gpt-5

  anthropic:
    kind: anthropic
    env_key: ANTHROPIC_API_KEY
    model: claude-opus-4-1-20250805
    settings:
      max_tokens: 1024
      temperature: 0.4

  openai:
    kind: openai
    env_key: OPENAI_API_KEY
    model: gpt-5
    settings:
      temperature: 0.4

  # ============================================================
  # PRESETS — переключаются per-request через API/CLI.
  # Клиент передаёт { "preset": "smartest" } в POST /api/run —
  # для этого запроса cast будет ходить в указанный preset.
  # Без указания — берётся тот, что в roles.<role>.provider (mock/302ai).
  # ============================================================

  # SMARTEST: топ reasoning + разнообразие. Медленно, дорого, максимальное качество.
  # Первым идёт Opus 4.1 (глубина reasoning), fallback через o1 → gpt-5 → grok-3 → deepseek-reasoner.
  smartest:
    kind: 302ai
    env_key: API_302AI_KEY
    model: claude-opus-4-1-20250805
    base_url: https://api.302.ai/v1
    settings:
      max_tokens: 1024
      temperature: 0.3
    fallbacks:
      - {kind: 302ai, env_key: API_302AI_KEY, model: o1, base_url: https://api.302.ai/v1, settings: {max_tokens: 1024, temperature: 0.3}, label: 302ai/o1}
      - {kind: 302ai, env_key: API_302AI_KEY, model: gpt-5, base_url: https://api.302.ai/v1, settings: {max_tokens: 1024, temperature: 0.3}, label: 302ai/gpt-5}
      - {kind: 302ai, env_key: API_302AI_KEY, model: grok-3, base_url: https://api.302.ai/v1, settings: {max_tokens: 1024, temperature: 0.3}, label: 302ai/grok-3}
      - {kind: 302ai, env_key: API_302AI_KEY, model: deepseek-reasoner, base_url: https://api.302.ai/v1, settings: {max_tokens: 1024, temperature: 0.3}, label: 302ai/deepseek-reasoner}

  # REASONING: reasoning-first (o1 → deepseek-reasoner → gpt-5 → opus). Для сложных тезисов и апорий.
  reasoning:
    kind: 302ai
    env_key: API_302AI_KEY
    model: o1
    base_url: https://api.302.ai/v1
    settings:
      max_tokens: 2048
    fallbacks:
      - {kind: 302ai, env_key: API_302AI_KEY, model: deepseek-reasoner, base_url: https://api.302.ai/v1, settings: {max_tokens: 2048}, label: 302ai/deepseek-reasoner}
      - {kind: 302ai, env_key: API_302AI_KEY, model: o3-mini, base_url: https://api.302.ai/v1, settings: {max_tokens: 2048}, label: 302ai/o3-mini}
      - {kind: 302ai, env_key: API_302AI_KEY, model: claude-opus-4-1-20250805, base_url: https://api.302.ai/v1, settings: {max_tokens: 1024, temperature: 0.3}, label: 302ai/opus-4-1}

  # DIVERSE: одна frontier-модель от каждого крупного лаба. Для полифонии стилей.
  diverse:
    kind: 302ai
    env_key: API_302AI_KEY
    model: claude-opus-4-1-20250805
    base_url: https://api.302.ai/v1
    settings:
      max_tokens: 1024
      temperature: 0.5
    fallbacks:
      - {kind: 302ai, env_key: API_302AI_KEY, model: gpt-5, base_url: https://api.302.ai/v1, settings: {max_tokens: 1024, temperature: 0.5}, label: 302ai/gpt-5}
      - {kind: 302ai, env_key: API_302AI_KEY, model: grok-3, base_url: https://api.302.ai/v1, settings: {max_tokens: 1024, temperature: 0.5}, label: 302ai/grok-3}
      - {kind: 302ai, env_key: API_302AI_KEY, model: gemini-2.0-flash-exp, base_url: https://api.302.ai/v1, settings: {max_tokens: 1024, temperature: 0.5}, label: 302ai/gemini-2.0-flash-exp}
      - {kind: 302ai, env_key: API_302AI_KEY, model: deepseek-chat, base_url: https://api.302.ai/v1, settings: {max_tokens: 1024, temperature: 0.5}, label: 302ai/deepseek-chat}

  # FAST: быстро и дёшево. Sonnet 4 → gpt-4o → deepseek-chat.
  fast:
    kind: 302ai
    env_key: API_302AI_KEY
    model: claude-sonnet-4-20250514
    base_url: https://api.302.ai/v1
    settings:
      max_tokens: 2048
      temperature: 0.4
    fallbacks:
      - {kind: 302ai, env_key: API_302AI_KEY, model: gpt-4o, base_url: https://api.302.ai/v1, settings: {max_tokens: 2048, temperature: 0.4}, label: 302ai/gpt-4o}
      - {kind: 302ai, env_key: API_302AI_KEY, model: deepseek-chat, base_url: https://api.302.ai/v1, settings: {max_tokens: 2048, temperature: 0.4}, label: 302ai/deepseek-chat}

  # CHEAP: минимум денег. deepseek-chat → gpt-4o.
  cheap:
    kind: 302ai
    env_key: API_302AI_KEY
    model: deepseek-chat
    base_url: https://api.302.ai/v1
    settings:
      max_tokens: 2048
      temperature: 0.4
    fallbacks:
      - {kind: 302ai, env_key: API_302AI_KEY, model: gpt-4o, base_url: https://api.302.ai/v1, settings: {max_tokens: 2048, temperature: 0.4}, label: 302ai/gpt-4o}

# Реестр пресетов для UI/CLI-выбора. Порядок = порядок в dropdown.
presets:
  - {name: "",       label: "по умолчанию — Opus 4.1 → gpt-5 → sonnet-4 → deepseek-r", provider: 302ai}
  - {name: smartest, label: "Умнее (Opus 4.1 + o1 + gpt-5 + grok-3)",              provider: smartest}
  - {name: reasoning, label: "Reasoning tier (o1 + deepseek-reasoner + o3-mini)",    provider: reasoning}
  - {name: diverse,  label: "Разные лабы (Opus 4.1 + gpt-5 + grok-3 + gemini)",     provider: diverse}
  - {name: fast,     label: "Быстро (Sonnet 4 + gpt-4o + deepseek-chat)",           provider: fast}
  - {name: cheap,    label: "Дёшево (deepseek-chat + gpt-4o)",                       provider: cheap}

roles:
  # Which provider serves which pipeline role.
  # Split so that heavy synthesis and orchestration can use different models.
  # Все дефолты сейчас указывают на 302ai — на mock переключается только при
  # отсутствии ключа API_302AI_KEY (см. config.py role_provider fallback).
  routing:
    provider: mock
  persona_turn:
    provider: mock
  zarathustra_orchestration:
    provider: mock
  zarathustra_situation_reading:
    provider: mock
  synthesis:
    provider: mock
  zarathustra_closing_speech:
    provider: mock       # override через preset_override + model_override per-request
  embeddings:
    provider: mock

# Список моделей, доступных через 302.ai — для UI dropdown "Модель".
# Проверены на нашем ключе (2026-07-29). Пользователь передаёт `model`
# в POST /api/run для точечного выбора (bypass preset chain).
model_menu:
  - {id: "",                                label: "по умолчанию (из пресета)"}
  - {id: claude-opus-4-1-20250805,          label: "Claude Opus 4.1"}
  - {id: claude-sonnet-4-20250514,          label: "Claude Sonnet 4"}
  - {id: claude-3-7-sonnet-latest,          label: "Claude Sonnet 3.7"}
  - {id: gpt-5,                             label: "GPT-5"}
  - {id: gpt-4.1,                           label: "GPT-4.1"}
  - {id: gpt-4o,                            label: "GPT-4o"}
  - {id: o1,                                label: "OpenAI o1 (reasoning)"}
  - {id: o3-mini,                           label: "OpenAI o3-mini (reasoning)"}
  - {id: deepseek-reasoner,                 label: "DeepSeek R1 (reasoning)"}
  - {id: deepseek-chat,                     label: "DeepSeek Chat"}
  - {id: grok-3,                            label: "Grok 3"}
  - {id: gemini-2.0-flash-exp,              label: "Gemini 2.0 Flash"}
# NOTE: default provider stays `mock` so `pip install` + `pytest` работают
# offline. Прод-инстанс переопределяет env-переменной:
#     CALIFORNIAN_ID_PROVIDER=302ai
# (см. /etc/tinkuy/tinkuy.env и DEPLOYMENT_RUNBOOK §7)
